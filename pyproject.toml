[project]
name = "solidsoft-payment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
